# Copy to .github/workflows/godot-ci.yml in a Godot 4 .NET project.
# Swap `godot-ci.yml` for godot-build.yml / godot-test.yml / godot-export.yml to run just one stage:
# they all accept the same inputs.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  godot:
    uses: nick-vas/Claude-Test/.github/workflows/godot-ci.yml@main
    with:
      pipelines-ref: main            # keep in step with the @ref above
      godot-version: "4.6.1"
      project-path: .                # folder containing project.godot
      # solution: MyGame.sln         # default: first .sln/.csproj in project-path
      # addons: gut@v9.6.1          # for the gut runner
      # Pick any of: dotnet, gdunit4, godottest, gut, smoke (see docs/godot-pipelines.md)
      test-runners: '["dotnet", "smoke"]'
      coverage: true
      export-presets: '["Linux", "Windows"]'   # names from export_presets.cfg; '[]' to skip
