name: Godot
description: Build, test or export a Godot 4 project (GDScript or C#). Detects the project, Godot version and test frameworks; caches everything.
inputs:
  command:
    description: "test (default), build, or export"
    default: test
  project:
    description: Folder with project.godot (default - detected)
    default: ""
  godot-version:
    description: "e.g. 4.6.1 or 4.7-rc1 (default - from Godot.NET.Sdk in the csproj, else 4.6.1)"
    default: ""
  runners:
    description: "Comma list of dotnet, gdunit4, godottest, gut, smoke, or none (default - detected)"
    default: ""
  filter:
    description: Test filter passed to each runner
    default: ""
  coverage:
    description: Collect coverage into the results artifact and job summary
    default: "false"
  preset:
    description: "export: one preset name (default - every preset)"
    default: ""
  retention-days:
    description: Days to keep uploaded artifacts
    default: "14"
outputs:
  presets:
    description: JSON array of the project's export presets
    value: ${{ steps.detect.outputs.presets }}
runs:
  using: composite
  steps:
    - id: detect
      shell: bash
      env:
        CLI: ${{ github.action_path }}/../../../ci/godot/godot-ci
        PROJECT: ${{ inputs.project }}
        GODOT_VERSION_INPUT: ${{ inputs.godot-version }}
      run: |
        args=(detect --github-output)
        [[ -n "$PROJECT" ]] && args+=(--project "$PROJECT")
        [[ -n "$GODOT_VERSION_INPUT" ]] && args+=(--godot-version "$GODOT_VERSION_INPUT")
        "$CLI" "${args[@]}"

    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 8.0.x

    - id: paths
      shell: bash
      run: |
        if [[ "$RUNNER_OS" == "macOS" ]]; then
          echo "templates=$HOME/Library/Application Support/Godot/export_templates" >> "$GITHUB_OUTPUT"
        else
          echo "templates=${XDG_DATA_HOME:-$HOME/.local/share}/godot/export_templates" >> "$GITHUB_OUTPUT"
        fi

    - uses: actions/cache@v6
      with:
        path: ~/.godot-ci
        key: godot-ci-${{ runner.os }}-${{ runner.arch }}-${{ steps.detect.outputs.godot-version }}

    - if: inputs.command == 'export'
      uses: actions/cache@v6
      with:
        path: ${{ steps.paths.outputs.templates }}
        key: godot-templates-${{ steps.detect.outputs.godot-version }}

    - uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/packages.lock.json') }}
        restore-keys: nuget-${{ runner.os }}-

    - id: run
      shell: bash
      env:
        CLI: ${{ github.action_path }}/../../../ci/godot/godot-ci
        COMMAND: ${{ inputs.command }}
        PROJECT: ${{ steps.detect.outputs.project }}
        GODOT_VERSION_INPUT: ${{ steps.detect.outputs.godot-version }}
        RUNNERS: ${{ inputs.runners }}
        FILTER: ${{ inputs.filter }}
        COVERAGE: ${{ inputs.coverage }}
        PRESET: ${{ inputs.preset }}
        NAME: ${{ steps.detect.outputs.name }}
      run: |
        args=("$COMMAND" --project "$PROJECT" --godot-version "$GODOT_VERSION_INPUT")
        [[ -n "$RUNNERS" ]] && args+=(--runners "$RUNNERS")
        [[ -n "$FILTER" ]] && args+=(--filter "$FILTER")
        [[ "$COVERAGE" == "true" ]] && args+=(--coverage)
        [[ -n "$PRESET" ]] && args+=(--preset "$PRESET")
        results="$RUNNER_TEMP/godot-test-results"; output="$RUNNER_TEMP/godot-build"
        echo "results=$results" >> "$GITHUB_OUTPUT"
        echo "output=$output" >> "$GITHUB_OUTPUT"
        # Unique per OS and project, so matrix and monorepo callers don't collide.
        echo "artifact=$NAME-$RUNNER_OS" >> "$GITHUB_OUTPUT"
        # Preset names may hold characters artifact names reject (e.g. "Linux/X11").
        echo "export-artifact=$NAME-$(printf '%s' "${PRESET:-all}" | tr -c 'A-Za-z0-9._-' '-')" >> "$GITHUB_OUTPUT"
        "$CLI" "${args[@]}" --results "$results" --output "$output"

    - if: always() && inputs.command == 'test' && steps.run.outputs.results != ''
      uses: actions/upload-artifact@v7
      with:
        name: test-results-${{ steps.run.outputs.artifact }}
        path: ${{ steps.run.outputs.results }}
        if-no-files-found: ignore
        retention-days: ${{ inputs.retention-days }}

    - if: inputs.command == 'export'
      uses: actions/upload-artifact@v7
      with:
        # One artifact per call: export a single preset per job to get one download per platform.
        name: ${{ steps.run.outputs.export-artifact }}
        path: ${{ steps.run.outputs.output }}
        retention-days: ${{ inputs.retention-days }}
