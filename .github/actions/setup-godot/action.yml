name: Setup Godot .NET
description: Installs the .NET SDK and the Godot .NET editor (plus export templates on request), with caching.
inputs:
  godot-version:
    description: Godot version, e.g. 4.6.1
    default: "4.6.1"
  godot-release:
    description: Release channel suffix, e.g. stable, rc1, beta2
    default: stable
  dotnet-version:
    description: .NET SDK channel Godot's C# projects target
    default: "8.0"
  templates:
    description: Also install export templates (needed only for exporting)
    default: "false"
  cache:
    description: Cache the editor, templates and NuGet packages between runs
    default: "true"
outputs:
  godot-bin:
    description: Absolute path of the Godot executable
    value: ${{ steps.install.outputs.godot-bin }}
runs:
  using: composite
  steps:
    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ inputs.dotnet-version }}.x

    - id: paths
      shell: bash
      run: |
        if [[ "$RUNNER_OS" == "macOS" ]]; then
          echo "templates=$HOME/Library/Application Support/Godot/export_templates" >> "$GITHUB_OUTPUT"
        else
          echo "templates=${XDG_DATA_HOME:-$HOME/.local/share}/godot/export_templates" >> "$GITHUB_OUTPUT"
        fi

    - if: inputs.cache == 'true'
      uses: actions/cache@v6
      with:
        path: ~/.godot-ci
        key: godot-editor-${{ runner.os }}-${{ runner.arch }}-${{ inputs.godot-version }}-${{ inputs.godot-release }}

    - if: inputs.cache == 'true' && inputs.templates == 'true'
      uses: actions/cache@v6
      with:
        path: ${{ steps.paths.outputs.templates }}/${{ inputs.godot-version }}.${{ inputs.godot-release }}.mono
        key: godot-templates-${{ inputs.godot-version }}-${{ inputs.godot-release }}

    - if: inputs.cache == 'true'
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props', '**/packages.lock.json') }}
        restore-keys: nuget-${{ runner.os }}-

    - id: install
      shell: bash
      env:
        GODOT_VERSION: ${{ inputs.godot-version }}
        GODOT_RELEASE: ${{ inputs.godot-release }}
        DOTNET_CHANNEL: ${{ inputs.dotnet-version }}
        TEMPLATES: ${{ inputs.templates }}
      run: |
        args=()
        [[ "$TEMPLATES" == "true" ]] && args+=(--templates)
        "$GITHUB_ACTION_PATH/../../../ci/godot/install.sh" "${args[@]}"
        source ~/.godot-ci/env.sh
        echo "godot-bin=$GODOT_BIN" >> "$GITHUB_OUTPUT"
