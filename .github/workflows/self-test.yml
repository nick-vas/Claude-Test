# Exercises the pipeline against the examples on Windows, through every entry point.
name: Self-test

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Static checks only (no Godot), so they run on the cheaper Linux runner.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck -x ci/godot/*.sh ci/godot/godot-ci
      - name: Parse action manifests
        # actionlint covers workflows only; make sure every composite action is valid YAML.
        run: |
          for f in .github/actions/*/action.yml; do
            python3 -c 'import sys, yaml; yaml.safe_load(open(sys.argv[1]))' "$f"
            echo "ok $f"
          done
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  # No inputs at all: detects the shallowest project (examples/gdscript), installs GUT, runs gut + smoke.
  zero-config:
    uses: ./.github/workflows/godot.yml

  # C# project: detected dotnet (xUnit + gdUnit4Net), godottest, gut and smoke, with coverage and the
  # Windows export.
  csharp:
    uses: ./.github/workflows/godot.yml
    with:
      project: examples/breakout/game
      coverage: true
      exports: all
      retention-days: 3

  # Runners picked by hand.
  explicit-runners:
    uses: ./.github/workflows/godot.yml
    with:
      project: examples/breakout/game
      runners: gdunit4,gut

  # The CLI on a bare Windows runner, from Git Bash, cmd and PowerShell, as on a developer machine.
  cli:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Git Bash
        shell: bash
        run: ci/godot/godot-ci test --project examples/gdscript
      - name: cmd
        shell: cmd
        run: ci\godot\godot-ci.cmd test --project examples/breakout/game --runners dotnet --filter "FullyQualifiedName~RunState"
      - name: PowerShell
        shell: pwsh
        run: |
          .\ci\godot\godot-ci.cmd detect --project examples/breakout/game
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # The composite action inside a custom workflow.
  action:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/godot
        with:
          command: build
          project: examples/breakout/game
