# Exercises the suite on every change: the reusable workflow on Linux runners, and the script on Windows
# exactly as it runs on a developer machine.
name: Self-test

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $issues = Invoke-ScriptAnalyzer -Path ci/godot -Recurse -Settings ci/godot/PSScriptAnalyzerSettings.psd1
          $issues | Format-Table -AutoSize RuleName, ScriptName, Line, Message | Out-String -Width 200
          if ($issues) { exit 1 }
      - name: Parse action manifests
        # actionlint covers workflows only; make sure every composite action is valid YAML.
        run: |
          for f in .github/actions/*/action.yml; do
            python3 -c 'import sys, yaml; yaml.safe_load(open(sys.argv[1]))' "$f"
            echo "ok $f"
          done
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  # No inputs at all: detects the shallowest project (examples/gdscript), installs GUT, runs gut + smoke.
  zero-config:
    uses: ./.github/workflows/godot.yml

  # C# project: detected dotnet (xUnit + gdUnit4Net), godottest, gut and smoke, with coverage, then the
  # Windows export built on Linux.
  csharp:
    uses: ./.github/workflows/godot.yml
    with:
      project: examples/breakout/game
      coverage: true
      exports: all
      retention-days: 3

  # Runners picked by hand.
  explicit-runners:
    uses: ./.github/workflows/godot.yml
    with:
      project: examples/breakout/game
      runners: gdunit4,gut

  # The composite action inside a custom workflow.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/godot
        with:
          command: build
          project: examples/breakout/game

  # The script on Windows, as on a developer machine: no workflow, no action.
  local-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: GDScript example
        shell: pwsh
        run: ./ci/godot/godot-ci.ps1 test -Project examples/gdscript
      - name: C# example with coverage
        shell: pwsh
        run: ./ci/godot/godot-ci.ps1 test -Project examples/breakout/game -Coverage
      - name: Filtered run
        shell: pwsh
        run: ./ci/godot/godot-ci.ps1 test -Project examples/breakout/game -Runners dotnet -Filter 'FullyQualifiedName~RunState'
