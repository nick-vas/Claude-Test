# Exercises the pipeline against the examples on every change, through every entry point.
name: Self-test

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck -x ci/godot/*.sh ci/godot/godot-ci
      - name: Parse action manifests
        # actionlint covers workflows only; make sure every composite action is valid YAML.
        run: |
          for f in .github/actions/*/action.yml; do
            python3 -c 'import sys, yaml; yaml.safe_load(open(sys.argv[1]))' "$f"
            echo "ok $f"
          done
      - name: actionlint
        run: |
          bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color

  # No inputs at all: detects the shallowest project (examples/gdscript), installs GUT, runs gut + smoke.
  zero-config:
    uses: ./.github/workflows/godot.yml

  # C# project: detected dotnet (xUnit + gdUnit4Net), godottest, gut and smoke, with coverage and exports.
  csharp:
    uses: ./.github/workflows/godot.yml
    with:
      project: examples/breakout/game
      coverage: true
      exports: all
      retention-days: 3

  # Explicit runners on macOS.
  macos:
    uses: ./.github/workflows/godot.yml
    with:
      project: examples/breakout/game
      runners: gdunit4,gut
      runs-on: macos-latest

  # The CLI on a bare runner, exactly as on a developer machine or in a Claude cloud session.
  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ci/godot/godot-ci test --project examples/gdscript
      - run: ci/godot/godot-ci test --project examples/breakout/game --runners dotnet --filter "FullyQualifiedName~RunState"

  # The composite action inside a custom workflow.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/godot
        with:
          command: build
          project: examples/breakout/game
